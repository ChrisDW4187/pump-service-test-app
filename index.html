<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101827"><title>Pump Service Test</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#e9eef7;background:#0d1421}*{box-sizing:border-box}body{margin:0}header{background:#172235;padding:18px 16px;border-bottom:1px solid #354256;position:sticky;top:0;z-index:2}header strong{font-size:19px}main{max-width:980px;margin:auto;padding:16px 16px 80px}.muted{color:#a8b7cc;font-size:13px}.panel{background:#172235;border:1px solid #354256;border-radius:14px;padding:17px;margin:14px 0}h2{font-size:20px;margin:0 0 13px}h3{font-size:16px;margin:15px 0 8px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.field{display:flex;flex-direction:column;gap:5px;font-size:13px;color:#b8c7da}input,select,textarea{width:100%;font:inherit;font-size:16px;border:1px solid #52627b;border-radius:9px;background:#0c1524;color:white;padding:11px;min-height:44px}textarea{min-height:100px}.buttons{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}button{background:#286bd8;color:white;border:0;border-radius:9px;padding:11px 15px;font-weight:650;font-size:14px;cursor:pointer}button.secondary{background:#34445e}button.danger{background:#8c3440}button:disabled{opacity:.45}.steps{display:flex;gap:5px;overflow-x:auto;padding:8px 0}.steps button{white-space:nowrap;background:#27354b}.steps button.active{background:#286bd8}.testrow{padding:12px;border:1px solid #354256;border-radius:12px;margin:10px 0}.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:8px}.metric{background:#0c1524;border-radius:8px;padding:10px}.metric b{display:block;font-size:19px;margin-top:5px}table{width:100%;border-collapse:collapse;font-size:12px}th,td{border-bottom:1px solid #354256;text-align:left;padding:8px 5px}td button{padding:7px;font-size:12px}.scroll{overflow-x:auto}.hide{display:none!important}#printReport{display:none}.notice{padding:10px;border-left:3px solid #5c91e7;background:#24354c;border-radius:6px;font-size:13px}.status{font-size:12px;color:#8de0b2}
@media print{body{background:white;color:black;font:11px Arial}header,main,.no-print{display:none!important}#printReport{display:block!important;padding:12px}#printReport h1{font-size:19px}#printReport table{font-size:9px}#printReport th,#printReport td{border:1px solid #aaa;padding:4px}#printReport section{break-inside:avoid;margin-bottom:14px}#printReport .reportgrid{display:grid;grid-template-columns:1fr 1fr;gap:5px}#printReport p{margin:5px 0} @page{size:letter;margin:0.45in}}
</style></head><body><header><strong>🚒 Pump Service Test</strong><div class="muted">Digital apparatus service test sheet <span class="status" id="saveStatus"></span></div></header><main><div class="steps" id="steps"></div><div id="page"></div><div class="buttons" id="nav"></div></main><article id="printReport"></article><script>
const STORE='pump-service-tests-v1',DRAFT='pump-service-draft-v1';const steps=['Apparatus','Setup & controls','150 PSI · 100%','200 PSI · 70%','250 PSI · 50%','Other tests','Review & share','History'];const specs=[{name:'First Test',pct:'100%',psi:150,count:5,layout:'1 X 5" X 25 FT.',tip:'2.5',nozzle:66,gpm:1500},{name:'Second Test',pct:'70%',psi:200,count:3,layout:'1 X 5" X 35 FT.',tip:'2',nozzle:78,gpm:1050},{name:'Third Test',pct:'50%',psi:250,count:3,layout:'1 X 5" X 25 FT.',tip:'1.75',nozzle:68,gpm:750}];
const apparatus=[['department','Fire Department'],['date','Date of Test','date'],['manufacturer','Manufacturer Name'],['year','Year Model','number'],['apparatus','Department Apparatus #'],['makeModel','Manufacturer’s Make & Model #'],['serial','Manufacturer or S.O. #'],['engine','Engine Make & Model #'],['displacement','Engine Displacement'],['bhp','BHP','number'],['bhpRpm','BHP @ RPM','number'],['pump','Pump Make & Model #'],['pumpSerial','Pump Serial #'],['torque','Torque','number'],['torqueRpm','Torque @ RPM','number']];
const setup=[['ratio150','Engine-to-pump gear ratio @ 150 PSI','number'],['ratio200','Engine-to-pump gear ratio @ 200 PSI','number'],['ratio250','Engine-to-pump gear ratio @ 250 PSI','number'],['gear150','Transmission gear @ 150 PSI'],['gear200','Transmission gear @ 200 PSI'],['gear250','Transmission gear @ 250 PSI'],['control150','Pressure control: 100% @ 150 PSI','pass'],['control90','Pressure control: 100% @ 90 PSI','pass'],['control250','Pressure control: 50% @ 250 PSI','pass'],['req100','Test requirement 100% (GPM @ 150 PSI)','number'],['req70','Test requirement 70% (GPM @ 200 PSI)','number'],['req50','Test requirement 50% (GPM @ 250 PSI)','number'],['tester','Test performed by'],['location','Test location'],['elevation','Elevation','number'],['waterTemp','H2O temperature','number'],['airTemp','Air temperature','number'],['source','Test conducted from','source'],['barometer','Barometric pressure (in Hg)','number'],['hoseSize','Suction hose size (inches)','number'],['hoseLength','Suction hose length (feet)','number'],['lift','Lift (feet)','number'],['suctionTime','Time to obtain suction (seconds)','number'],['governedSpecified','No-load governed speed specified (RPM)','number'],['governedRecorded','No-load governed speed recorded (RPM)','number'],['vacuumDrop','Vacuum test: drop in 5 minutes (in Hg)','number'],['speedLocation','Speed-check reading location'],['takenWith','Taken with'],['counterRatio','Counter ratio (engine/pump, 1 to …)','number'],['counterMode','Counter ratio basis','counter'],['tankGallons','Tank-to-pump flow: gallons delivered','number'],['tankGpm','Tank-to-pump flow: GPM','number']];
const reading=[['time','Time'],['actualCounter','Actual counter reading','number'],['apparatusTach','Apparatus tach (RPM)','number'],['apparatusPressure','Pump pressure: apparatus gauge (PSI)','number'],['testPressure','Pump pressure: test gauge (PSI)','number'],['suction','Actual suction pressure (PSI)','number'],['pitot','Pitot pressure (PSI)','number'],['gpm','GPM','number'],['voltage','Voltage','number'],['transTemp','Transmission temperature','number'],['oilPressure','Oil pressure (PSI)','number'],['waterTemp','Water temperature','number']];
const extra=[['excessGpm','Excess power: GPM','number'],['excessNpp','Excess power: net pump pressure (PSI)','number'],['excessActualCounter','Excess power: actual counter reading','number'],['excessApparatusTach','Excess power: apparatus tach speed (RPM)','number'],['excessTime','Excess power: time'],['excessPitot','Excess power: pitot PSI','number'],['excessNotes','5-minute excess power test notes'],['comments','Comments','textarea'],['signature','Signature (typed name)'],['title','Title']];
function fresh(){return {id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),created:new Date().toISOString(),values:{department:'Cary FD',date:new Date().toLocaleDateString('en-CA'),counterMode:'engine'},tests:specs.map(s=>({layout:s.layout,tip:s.tip,nozzle:s.nozzle,targetGpm:s.gpm,position:'Single',rows:Array.from({length:s.count},()=>({}))}))}};
function getJson(k,def){try{return JSON.parse(localStorage.getItem(k))||def}catch{return def}}let data=getJson(DRAFT,null)||fresh(),history=getJson(STORE,[]),step=0;function persist(){localStorage.setItem(DRAFT,JSON.stringify(data));document.getElementById('saveStatus').textContent=' · Draft saved on this device'}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function field([key,label,type],value,prefix){let opts=type==='pass'?['','P','F']:type==='source'?['','Draft','Hydrant']:type==='counter'?['engine','pump']:null;return `<label class="field">${esc(label)}${opts?`<select data-path="${prefix}${key}">${opts.map(x=>`<option value="${x}" ${value===x?'selected':''}>${x||'Select…'}</option>`).join('')}</select>`:type==='textarea'?`<textarea data-path="${prefix}${key}">${esc(value)}</textarea>`:`<input data-path="${prefix}${key}" type="${type==='number'?'number':type==='date'?'date':'text'}" ${type==='number'?'step="any" inputmode="decimal"':''} value="${esc(value)}">`}</label>`}function grid(fields,values,prefix='values.'){return `<div class="grid">${fields.map(f=>field(f,values[f[0]],prefix)).join('')}</div>`}function n(v){return v===''||v==null?null:Number.isFinite(Number(v))?Number(v):null}function fmt(v){return v==null?'—':Math.round(v*100)/100}function avg(arr,key,compute){let a=arr.map(r=>compute?compute(r):n(r[key])).filter(x=>x!==null&&Number.isFinite(x));return a.length?a.reduce((x,y)=>x+y,0)/a.length:null}function ratioFor(i){return n(data.values['ratio'+[150,200,250][i]])}function counterRatio(){return n(data.values.counterRatio)}function engineCounter(r){let v=n(r.actualCounter),k=counterRatio();return v===null||k===null?null:v*k}function pumpCounter(r,i){let e=engineCounter(r),ratio=ratioFor(i);return e===null||ratio===null?null:e*ratio}function results(i){let rows=data.tests[i].rows;return {pitot:avg(rows,'pitot'),gpm:avg(rows,'gpm'),apparatusPressure:avg(rows,'apparatusPressure'),testPressure:avg(rows,'testPressure'),suction:avg(rows,'suction'),engine:avg(rows,null,engineCounter),tach:avg(rows,'apparatusTach'),pump:avg(rows,null,r=>pumpCounter(r,i))}}function metrics(i){let r=results(i);return `<div class="metrics">${[['Avg GPM',r.gpm],['Avg pitot PSI',r.pitot],['Avg pump PSI',r.apparatusPressure],['Avg engine RPM',r.engine],['Avg pump RPM',r.pump]].map(([k,v])=>`<div class="metric"><small>${k}</small><b>${fmt(v)}</b></div>`).join('')}</div>`}
function render(){document.getElementById('steps').innerHTML=steps.map((s,i)=>`<button class="${step===i?'active':''}" data-step="${i}">${i+1}. ${s}</button>`).join('');let html='';if(step===0)html=`<section class="panel"><h2>Apparatus information</h2>${grid(apparatus,data.values)}</section>`;if(step===1)html=`<section class="panel"><h2>Test setup & pressure controls</h2><p class="notice">The original sheet uses counter ratio × actual counter reading for engine RPM, then engine RPM × gear ratio for pump RPM. Enter ratios before recording readings.</p>${grid(setup,data.values)}</section>`;if(step>=2&&step<=4){let i=step-2,s=specs[i],t=data.tests[i];html=`<section class="panel"><h2>${s.name} — ${s.pct} at ${s.psi} PSI</h2><p class="muted">${s.count} readings • Net pump pressure ${s.psi} PSI</p>${grid([['layout','Test layout'],['tip','Tip size (inches)'],['nozzle','Nozzle pressure (PSI)','number'],['targetGpm','Layout GPM','number'],['position','Pump changeover valve position']],t,`tests.${i}.`)}<h3>Recorded readings</h3>${t.rows.map((r,j)=>`<div class="testrow"><h3>Reading ${j+1} of ${s.count}</h3>${grid(reading,r,`tests.${i}.rows.${j}.`)}<p class="muted">Calculated engine counter RPM: ${fmt(engineCounter(r))} · Pump counter RPM: ${fmt(pumpCounter(r,i))}</p></div>`).join('')}<h3>Calculated averages</h3>${metrics(i)}</section>`}if(step===5)html=`<section class="panel"><h2>Excess power, comments & sign-off</h2>${grid(extra,data.values)}</section>`;if(step===6){html=`<section class="panel"><h2>Final results</h2><p class="muted">These are averages of entered readings only. Blank readings are excluded. GPM and pitot values are recorded, not inferred from nozzle formulas.</p><div class="scroll"><table><thead><tr><th>Metric</th>${specs.map(s=>`<th>${s.psi} PSI</th>`).join('')}</tr></thead><tbody>${[['Average nozzle pressure (pitot)','pitot'],['Gallons per minute','gpm'],['Changeover valve setting','position'],['Average pump pressure (apparatus)','apparatusPressure'],['Average pump pressure (test)','testPressure'],['Suction pressure','suction'],['Tip size','tip'],['Average engine RPM (counter)','engine'],['Average engine RPM (tach)','tach'],['Average pump RPM','pump']].map(([label,key])=>`<tr><td>${label}</td>${specs.map((s,i)=>`<td>${esc(key==='tip'?data.tests[i].tip:key==='position'?data.tests[i].position:fmt(results(i)[key]))}</td>`).join('')}</tr>`).join('')}</tbody></table></div><h3>Report actions</h3><div class="buttons"><button id="saveTest">Save completed test to history</button><button id="pdf">Print / Save as PDF</button><button id="share">Share report</button><button class="danger" id="new">New Test — Clear Form</button></div><p class="notice">Save to history before clearing. History and drafts are stored in this browser on this device, not synced to other devices. Export PDFs for permanent records.</p></section>`}if(step===7)html=`<section class="panel"><h2>Saved test history</h2><p class="muted">${history.length} saved test(s) on this device</p><div class="scroll"><table><thead><tr><th>Date</th><th>Apparatus</th><th>Department</th><th>Actions</th></tr></thead><tbody>${history.map(h=>`<tr><td>${esc(h.values.date)}</td><td>${esc(h.values.apparatus)}</td><td>${esc(h.values.department)}</td><td><button data-open="${h.id}">Open</button> <button data-report="${h.id}" class="secondary">PDF</button> <button data-delete="${h.id}" class="danger">Delete</button></td></tr>`).join('')}</tbody></table></div><div class="buttons"><button id="export">Export history backup (JSON)</button><button id="import" class="secondary">Import backup</button><input id="importFile" type="file" accept="application/json" class="hide"></div></section>`;document.getElementById('page').innerHTML=html;document.getElementById('nav').innerHTML=`<button class="secondary" id="prev" ${step===0?'disabled':''}>← Previous</button><button id="next" ${step===7?'disabled':''}>Next →</button><button class="secondary" id="historyBtn">History</button>`;document.getElementById('prev').onclick=()=>{step--;render()};document.getElementById('next').onclick=()=>{step++;render()};document.getElementById('historyBtn').onclick=()=>{step=7;render()};document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{step=+b.dataset.step;render()});document.querySelectorAll('[data-path]').forEach(el=>el.addEventListener('change',()=>{let parts=el.dataset.path.split('.'),o=data;for(let k of parts.slice(0,-1))o=o[k];o[parts.at(-1)]=el.value;persist();if(step>=2&&step<=4)render()}));if(step===6){document.getElementById('saveTest').onclick=saveTest;document.getElementById('pdf').onclick=()=>printTest(data);document.getElementById('share').onclick=()=>shareTest(data);document.getElementById('new').onclick=newTest}if(step===7){document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{if(!confirm('Open saved test? This replaces your current draft.'))return;data=structuredClone(history.find(h=>h.id===b.dataset.open));persist();step=0;render()});document.querySelectorAll('[data-report]').forEach(b=>b.onclick=()=>printTest(history.find(h=>h.id===b.dataset.report)));document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{if(confirm('Permanently delete this saved test?')){history=history.filter(h=>h.id!==b.dataset.delete);localStorage.setItem(STORE,JSON.stringify(history));render()}});document.getElementById('export').onclick=()=>download(new Blob([JSON.stringify(history,null,2)],{type:'application/json'}),'pump-test-history.json');document.getElementById('import').onclick=()=>document.getElementById('importFile').click();document.getElementById('importFile').onchange=async e=>{try{let a=JSON.parse(await e.target.files[0].text());if(!Array.isArray(a)||!a.every(x=>x.id&&x.values&&Array.isArray(x.tests)))throw Error('Invalid backup');if(confirm(`Import ${a.length} tests into history?`)){history=[...new Map([...history,...a].map(x=>[x.id,x])).values()];localStorage.setItem(STORE,JSON.stringify(history));render()}}catch(err){alert('Unable to import: '+err.message)}}}}
function saveTest(){history=[structuredClone(data),...history.filter(x=>x.id!==data.id)];localStorage.setItem(STORE,JSON.stringify(history));alert('Test saved to history on this device.')}function newTest(){if(!confirm('Start a new test? This clears the current form. Save the current test to history first if needed.'))return;data=fresh();persist();step=0;render()}function download(blob,name){let a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}
function reportHTML(d){let old=data;data=d;let out=`<h1>Pump Service Test Report</h1><p>Fire Department: ${esc(d.values.department)} &nbsp; | &nbsp; Date: ${esc(d.values.date)} &nbsp; | &nbsp; Apparatus #: ${esc(d.values.apparatus)}</p><section><h2>Apparatus information</h2><div class="reportgrid">${apparatus.map(([k,l])=>`<p><b>${esc(l)}:</b> ${esc(d.values[k])}</p>`).join('')}</div></section><section><h2>Setup & controls</h2><div class="reportgrid">${setup.map(([k,l])=>`<p><b>${esc(l)}:</b> ${esc(d.values[k])}</p>`).join('')}</div></section>`;for(let i=0;i<3;i++){let s=specs[i],t=d.tests[i];out+=`<section><h2>${s.name} (${s.pct} @ ${s.psi} PSI)</h2><p>Layout: ${esc(t.layout)} | Tip: ${esc(t.tip)} | Nozzle PSI: ${esc(t.nozzle)} | Layout GPM: ${esc(t.targetGpm)} | Position: ${esc(t.position)}</p><table><thead><tr><th>#</th>${reading.map(([k,l])=>`<th>${esc(l)}</th>`).join('')}<th>Engine counter RPM</th><th>Pump counter RPM</th></tr></thead><tbody>${t.rows.map((r,j)=>`<tr><td>${j+1}</td>${reading.map(([k])=>`<td>${esc(r[k])}</td>`).join('')}<td>${fmt(engineCounter(r))}</td><td>${fmt(pumpCounter(r,i))}</td></tr>`).join('')}</tbody></table><p>Average GPM: ${fmt(results(i).gpm)} | Pitot PSI: ${fmt(results(i).pitot)} | Apparatus pump PSI: ${fmt(results(i).apparatusPressure)} | Test pump PSI: ${fmt(results(i).testPressure)} | Suction PSI: ${fmt(results(i).suction)} | Engine counter RPM: ${fmt(results(i).engine)} | Tach RPM: ${fmt(results(i).tach)} | Pump RPM: ${fmt(results(i).pump)}</p></section>`}out+=`<section><h2>Excess power / sign-off</h2><div class="reportgrid">${extra.map(([k,l])=>`<p><b>${esc(l)}:</b> ${esc(d.values[k])}</p>`).join('')}</div></section>`;data=old;return out}function printTest(d){document.getElementById('printReport').innerHTML=reportHTML(d);window.print()}async function shareTest(d){let html=reportHTML(d),txt=html.replace(/<[^>]*>/g,' ').replace(/\s+/g,' ');if(navigator.share){try{await navigator.share({title:`Pump test ${d.values.apparatus||''}`,text:txt.slice(0,12000)});return}catch(e){if(e.name==='AbortError')return}}alert('Use Print / Save as PDF to share the formatted report as a PDF.');printTest(d)}persist();render();
</script></body></html>
